name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.3'
      - run: flutter pub get
      # canvaskit everywhere: the default "auto" serves the HTML renderer to
      # mobile browsers, and on iOS WebKit's small canvas-memory cap that
      # renderer crashes the tab on paint-heavy frames (the hint board).
      - run: flutter build web --release --web-renderer canvaskit --source-maps --base-href /sudokies/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
