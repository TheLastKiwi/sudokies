name: sudokies
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.0

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/starter.json
    - assets/puzzles/killer.json
    - assets/techniques.json
  # Bundle Roboto (the Material default family) so the CanvasKit renderer uses
  # these local files instead of downloading Roboto from fonts.gstatic.com at
  # runtime. Required for the app to render text fully offline.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
